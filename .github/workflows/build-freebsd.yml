name: FreeBSD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this same job to build the GitHub Release asset.
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest   # host runner; the VM action spins up a FreeBSD guest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          prepare: |
            pkg install -y \
              cmake \
              qt6-base qt6-declarative \
              python3 \
              lua54 \
              hunspell \
              qtkeychain-qt6 \
              pkgconf
          run: |
            cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH=/usr/local \
              -DNUCHAT_REQUIRE_KEYCHAIN=ON
            cmake --build build --parallel $(sysctl -n hw.ncpu)
            ctest --test-dir build --output-on-failure

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuchat-freebsd
          path: build/src/nuchat
