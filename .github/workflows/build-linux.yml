name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this same job to build the GitHub Release asset.
  workflow_call:

# contents: read is enough for checkout and artifacts.
# actions: write lets actions/cache save the ccache directory.
permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'tests/**', 'plugins/**', 'qml/**', 'cmake/**') }}
          restore-keys: |
            ccache-linux-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake ccache \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            libgl1-mesa-dev \
            python3-dev \
            liblua5.4-dev \
            libhunspell-dev \
            qtkeychain-qt6-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuchat-linux
          path: build/src/nuchat
