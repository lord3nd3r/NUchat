name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this same job to build the GitHub Release asset.
  workflow_call:

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Pinned: windows-latest now ships an MSVC STL that removed
    # stdext::checked_array_iterator, which Qt 6.5.3's headers still use.
    # Unpin once the Qt version below is bumped to 6.8.x.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python (for aqtinstall)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.5.3'
          host: windows
          target: desktop
          cache: true

      - name: Install NSIS
        run: choco install nsis

      # No package-manager QtKeychain matches this Qt (6.5.3 MSVC), so build it
      # from source against it. Static, so the NSIS installer needs no extra DLL.
      - name: Build QtKeychain (static)
        shell: bash
        run: |
          TMP="$(cygpath -m "$RUNNER_TEMP")"
          git clone --depth 1 --branch 0.15.0 \
            https://github.com/frankosterfeld/qtkeychain.git "$TMP/qtkeychain-src"
          cmake -S "$TMP/qtkeychain-src" -B "$TMP/qtkeychain-build" -A x64 \
            -DBUILD_WITH_QT6=ON -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TRANSLATIONS=OFF -DBUILD_TEST_APPLICATION=OFF \
            -DCMAKE_INSTALL_PREFIX="$TMP/qtkeychain"
          cmake --build "$TMP/qtkeychain-build" --config Release --parallel
          cmake --install "$TMP/qtkeychain-build" --config Release
          echo "QTKEYCHAIN_PREFIX=$TMP/qtkeychain" >> "$GITHUB_ENV"

      # Python is pre-installed on the runner. Lua and Hunspell are optional.
      # The action automatically sets up Qt6_DIR, PATH, and the environment.

      - name: Configure
        run: |
          cmake -B build -A x64 -DCMAKE_DISABLE_FIND_PACKAGE_Python3=ON `
            "-DCMAKE_PREFIX_PATH=$env:QTKEYCHAIN_PREFIX" `
            -DNUCHAT_REQUIRE_KEYCHAIN=ON

      - name: Build
        run: |
          cmake --build build --config Release --parallel --verbose

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package with CPack
        working-directory: build
        run: |
          cpack -C Release -G NSIS

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuchat-windows-installer
          path: build/NUchat_*_Windows_x64.exe
          if-no-files-found: warn
