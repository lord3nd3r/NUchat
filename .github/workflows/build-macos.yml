name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this same job to build the GitHub Release asset.
  workflow_call:

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Pinned: macos-latest now ships the Xcode 26 SDK, which removed the AGL
    # framework that Qt <= 6.8.3's FindWrapOpenGL still links on Apple.
    # Unpin once Qt is bumped to a release without the AGL reference.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Qt 6.8.3
        id: qt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Qt/6.8.3
          key: qt-6.8.3-macos-clang_64-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: |
          brew update
          brew install lua hunspell

      - name: Install Qt6 via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pip3 install aqtinstall --break-system-packages
          aqt install-qt mac desktop 6.8.3 clang_64 --outputdir "$HOME/Qt"

      - name: Export Qt paths
        run: |
          echo "$HOME/Qt/6.8.3/macos/bin" >> "$GITHUB_PATH"
          echo "Qt6_DIR=$HOME/Qt/6.8.3/macos/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/6.8.3/macos" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Deploy Qt (.app bundle)
        run: |
          APP="build/src/nuchat.app"
          if [ -d "$APP" ]; then
            macdeployqt "$APP" -qmldir=qml || echo "macdeployqt finished with warnings"
          fi

      - name: Package DMG
        run: |
          APP="build/src/nuchat.app"
          if [ -d "$APP" ]; then
            hdiutil create -volname NUchat -srcfolder "$APP" \
              -ov -format UDZO nuchat-macos.dmg
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuchat-macos
          path: nuchat-macos.dmg
